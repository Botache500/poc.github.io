title: "POCs & Security Research"
description: "Investigación de vulnerabilidades y pruebas de concepto"
url: "https://poc.github.io"
baseurl: ""
github_username:  tu-usuario

# Configuración del tema
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# Configuración de posts
permalink: /:categories/:title/
collections:
  pocs:
    output: true
    permalink: /pocs/:path/

# Búsqueda
search_enabled: true
