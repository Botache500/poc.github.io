<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda - POCs & Security Research</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --text-primary: #00ff41;
            --text-secondary: #00cc33;
            --border-color: #00ff41;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            padding: 20px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
        }
        nav {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        nav a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        nav a:hover {
            color: var(--text-secondary);
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }
        .search-container {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
        }
        #search-input {
            width: 100%;
            padding: 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 1.2rem;
            border-radius: 4px;
            font-family: inherit;
            transition: all 0.3s;
        }
        #search-input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }
        #search-results {
            margin-top: 15px;
        }
        .post-preview {
            background: var(--bg-secondary);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--border-color);
            transition: all 0.3s;
        }
        .post-preview:hover {
            border-left-color: var(--text-secondary);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.05);
        }
        .post-preview h3 a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s;
        }
        .post-preview h3 a:hover {
            text-decoration: underline;
            color: var(--text-secondary);
        }
        .post-meta {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .tag {
            background: rgba(0, 255, 65, 0.1);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            border: 1px solid rgba(0, 255, 65, 0.3);
        }
        .cve-badge {
            display: inline-block;
            background: #ff0000;
            color: #fff;
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s;
        }
        .back-link:hover {
            color: var(--text-primary);
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            nav {
                gap: 15px;
            }
            .post-meta {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <a href="/poc.github.io/">🏠 Inicio</a>
                <a href="/poc.github.io/search.html">🔍 Buscar</a>
                <a href="https://github.com/botache500">📂 GitHub</a>
            </nav>
        </header>

        <h1>🔍 Buscador de POCs</h1>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 Buscar por CVE, herramienta, sistema..." oninput="searchPosts(this.value)">
            <div id="search-results"></div>
        </div>

        <div id="posts-container"></div>

        <footer>
            <p>POCs & Security Research es mantenido por botache500</p>
            <p>⚡ Generado con GitHub Pages</p>
        </footer>
    </div>

    <script>
        // ============================================
        // DATOS DE LOS POSTS (MISMOS QUE EN index.html)
        // ============================================
        const posts = [
            {
                id: 1,
                title: "CVE-2024-1234 - Escalada de Privilegios en Windows",
                date: "15/09/2026",
                categories: ["Windows", "CVE"],
                tags: ["windows", "privesc", "kernel", "cve-2024-1234"],
                cve: "CVE-2024-1234",
                excerpt: "Explotación de una vulnerabilidad en el kernel de Windows que permite escalar privilegios de usuario a SYSTEM."
            },
            {
                id: 2,
                title: "Post de Prueba - Mi primer POC",
                date: "09/09/2026",
                categories: ["Linux", "Test"],
                tags: ["test", "linux", "prueba", "bash"],
                cve: "",
                excerpt: "Este es un post de prueba para verificar que la funcionalidad está funcionando correctamente."
            }
        ];

        // ============================================
        // FUNCIONES
        // ============================================

        function renderPosts(postsToShow) {
            const container = document.getElementById('posts-container');
            if (!container) return;

            if (postsToShow.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-secondary); padding: 40px 0;">📝 No se encontraron resultados.</p>`;
                return;
            }

            container.innerHTML = postsToShow.map(post => `
                <article class="post-preview">
                    <h3><a href="/poc.github.io/" onclick="showPost(${post.id}); return false;">${post.title}</a></h3>
                    <div class="post-meta">
                        <span>📅 ${post.date}</span>
                        <span>🏷️ ${post.categories.join(', ')}</span>
                        ${post.cve ? `<span class="cve-badge">🔴 ${post.cve}</span>` : ''}
                    </div>
                    <p>${post.excerpt}</p>
                    <div class="tags">
                        ${post.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                    </div>
                </article>
            `).join('');
        }

        function searchPosts(query) {
            const q = query.toLowerCase().trim();
            const resultsContainer = document.getElementById('search-results');

            if (!q) {
                resultsContainer.innerHTML = '';
                renderPosts(posts);
                return;
            }

            const results = posts.filter(post => {
                const searchable = [
                    post.title,
                    post.excerpt,
                    ...post.tags,
                    ...post.categories,
                    post.cve || ''
                ].join(' ').toLowerCase();
                return searchable.includes(q);
            });

            renderPosts(results);

            if (results.length === 0) {
                resultsContainer.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 20px; border: 1px solid var(--border-color); margin-top: 20px;">🔍 No se encontraron resultados para "${q}"</div>`;
            } else {
                resultsContainer.innerHTML = `<div style="background: rgba(0,255,65,0.05); border: 1px solid var(--border-color); padding: 10px; margin-top: 20px; text-align: center; color: var(--text-secondary);">🎯 ${results.length} resultados encontrados</div>`;
            }
        }

        // Esta función redirige al index con el post abierto
        function showPost(id) {
            // Como estamos en search.html, redirigimos al index con el parámetro
            window.location.href = `/poc.github.io/?post=${id}`;
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            renderPosts(posts);
        });
    </script>
</body>
</html>
