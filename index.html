<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POCs & Security Research</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <a href="index.html">🏠 Inicio</a>
                <a href="search.html">🔍 Buscar</a>
                <a href="https://github.com/botache500">📂 GitHub</a>
            </nav>
        </header>

        <div class="hero">
            <h1>🔒 Security Research & POCs</h1>
            <p>Investigación de vulnerabilidades • Pruebas de concepto • Writeups técnicos</p>
        </div>

        <div class="search-container" style="background: var(--bg-secondary); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 40px;">
            <input type="text" id="search-input" placeholder="🔍 Buscar por CVE, herramienta, sistema..." style="width: 100%; padding: 15px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); font-size: 1.2rem; border-radius: 4px; font-family: inherit;">
            <div id="search-results" style="margin-top: 15px;"></div>
        </div>

        <div class="categories">
            <h2>Categorías</h2>
            <div class="category-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0 40px 0;">
                <button class="category-tag" onclick="filterCategory('windows')" style="background: var(--bg-secondary); padding: 15px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); cursor: pointer; font-family: inherit; transition: all 0.3s;">🪟 Windows</button>
                <button class="category-tag" onclick="filterCategory('linux')" style="background: var(--bg-secondary); padding: 15px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); cursor: pointer; font-family: inherit; transition: all 0.3s;">🐧 Linux</button>
                <button class="category-tag" onclick="filterCategory('web')" style="background: var(--bg-secondary); padding: 15px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); cursor: pointer; font-family: inherit; transition: all 0.3s;">🌐 Web</button>
                <button class="category-tag" onclick="filterCategory('api')" style="background: var(--bg-secondary); padding: 15px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); cursor: pointer; font-family: inherit; transition: all 0.3s;">🔌 API</button>
                <button class="category-tag" onclick="filterCategory('ad')" style="background: var(--bg-secondary); padding: 15px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); cursor: pointer; font-family: inherit; transition: all 0.3s;">🏢 AD</button>
                <button class="category-tag" onclick="filterCategory('cve')" style="background: var(--bg-secondary); padding: 15px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); cursor: pointer; font-family: inherit; transition: all 0.3s;">⚠️ CVEs</button>
                <button class="category-tag" onclick="showAllPosts()" style="background: var(--bg-secondary); padding: 15px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); cursor: pointer; font-family: inherit; transition: all 0.3s;">📋 Todos</button>
            </div>
        </div>

        <div class="recent-posts">
            <h2>Últimos POCs publicados</h2>
            <div id="posts-container"></div>
        </div>

        <footer>
            <p>POCs & Security Research es mantenido por botache500</p>
            <p>⚡ Generado con GitHub Pages</p>
        </footer>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
