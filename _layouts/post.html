---
layout: default
---
<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
            <span>📅 {{ page.date | date: "%d/%m/%Y" }}</span>
            <span>🏷️ {{ page.categories | join: ", " }}</span>
            <span>⏱️ Tiempo de lectura: {{ page.read_time }} min</span>
        </div>
        {% if page.cve %}
        <div class="cve-badge">🔴 CVE: {{ page.cve }}</div>
        {% endif %}
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <div class="post-footer">
        <div class="tags">
            {% for tag in page.tags %}
            <span class="tag">#{{ tag }}</span>
            {% endfor %}
        </div>
        
        <div class="share">
            <button onclick="navigator.clipboard.writeText(window.location.href)">
                📋 Compartir enlace
            </button>
        </div>
    </div>
</article>

<style>
.copy-btn {
    background: #2d2d2d;
    color: #fff;
    border: 1px solid #4a4a4a;
    border-radius: 4px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 12px;
    float: right;
    margin-top: 8px;
}
.copy-btn:hover {
    background: #3d3d3d;
}
</style>
