<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }} - {{ page.title }}</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --text-primary: #00ff41;
            --text-secondary: #00cc33;
            --border-color: #00ff41;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            padding: 20px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
        }
        
        nav {
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        
        nav a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        
        nav a:hover {
            color: var(--text-secondary);
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }
        
        .post-content {
            margin: 30px 0;
        }
        
        .post-content h2 {
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin: 30px 0 20px 0;
        }
        
        .post-content pre {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 65, 0.3);
            overflow-x: auto;
            position: relative;
            margin: 20px 0;
        }
        
        .post-content code {
            color: var(--text-primary);
            font-family: 'Consolas', 'Courier New', monospace;
        }
        
        .post-content img {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin: 20px 0;
        }
        
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 255, 65, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        .copy-btn:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }
        
        footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <a href="{{ site.baseurl }}/">🏠 Inicio</a>
                <a href="{{ site.baseurl }}/search.html">🔍 Buscar</a>
                <a href="https://github.com/{{ site.github_username }}">📂 GitHub</a>
            </nav>
        </header>

        <main>
            {{ content }}
        </main>

        <footer>
            <p>{{ site.title }} es mantenido por {{ site.github_username }}</p>
            <p>⚡ Generado con GitHub Pages</p>
        </footer>
    </div>

    <script>
    // Función para copiar código
    function copyCode(button) {
        const codeBlock = button.parentElement.querySelector('code');
        if (codeBlock) {
            navigator.clipboard.writeText(codeBlock.textContent);
            button.textContent = '✅ Copiado!';
            setTimeout(() => {
                button.textContent = '📋 Copiar';
            }, 2000);
        }
    }

    // Agregar botones de copiar a todos los bloques de código
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('pre').forEach(pre => {
            const button = document.createElement('button');
            button.className = 'copy-btn';
            button.textContent = '📋 Copiar';
            button.onclick = function() { copyCode(this); };
            pre.style.position = 'relative';
            pre.appendChild(button);
        });
    });
    </script>
</body>
</html>
